name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ipcalc-linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ipcalc-linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: ipcalc-macos-aarch64
            rust_target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: ipcalc-macos-x86_64
            rust_target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: ipcalc-windows.exe
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
          targets: ${{ matrix.rust_target }}

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            mv ipcalc.exe ${{ matrix.artifact_name }}
          else
            mv ipcalc ${{ matrix.artifact_name }}
          fi
          chmod +x ${{ matrix.artifact_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-static:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
          targets: x86_64-unknown-linux-musl

      - name: Build static binary
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          cd target/x86_64-unknown-linux-musl/release
          mv ipcalc ipcalc-linux-x86_64-musl
          chmod +x ipcalc-linux-x86_64-musl

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-unknown-linux-musl/release/ipcalc-linux-x86_64-musl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksum:
    needs: [build, build-static]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
